<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A3D" />
      <stop offset="100%" stop-color="#1B3825" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3D9B1" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
  </defs>
  
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#forestGrad)" />
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FAF7F2" stroke-width="6" opacity="0.2" />
  
  <!-- Camera Lens Outer Circle -->
  <circle cx="256" cy="256" r="140" fill="#FAF7F2" />
  <circle cx="256" cy="256" r="120" fill="url(#forestGrad)" />
  
  <!-- Sprout / Leaf Motif inside Lens -->
  <path d="M256 180 C290 180 320 210 320 250 C320 290 280 320 256 340 C232 320 192 290 192 250 C192 210 222 180 256 180 Z" fill="url(#leafGrad)" />
  <path d="M256 200 Q276 240 256 330" stroke="#FAF7F2" stroke-width="5" fill="none" opacity="0.8" stroke-linecap="round" />
  
  <!-- Aperture / Clean Lens Dot -->
  <circle cx="256" cy="256" r="16" fill="#FAF7F2" />
</svg>
