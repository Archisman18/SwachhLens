name: SwachhLens CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Backend Automated Testing & Linting ──
  backend-tests:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests

  # ── 2. Citizen App Build & Validation ──
  citizen-app-build:
    name: Citizen PWA App Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/citizen-app/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend/citizen-app
          npm ci
          npm run build

  # ── 3. Admin Dashboard Build & Validation ──
  admin-dashboard-build:
    name: Municipal Admin Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/admin-dashboard/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend/admin-dashboard
          npm ci
          npm run build
